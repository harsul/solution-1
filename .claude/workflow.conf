# Workflow settings for the team (/fepic, /fplan, /fwork, /ffix, the agents and the hooks). /finit sets
# them for a new project; edit them any time. Read with `.claude/scripts/work.sh config`; KEY=value, # comments.

# Task ID prefix and first number: F → F20, F21, …; ENG- → ENG-1, ENG-2, …
# Letters, optionally followed by a dash. Change it only before the first task of a project.
# F1–F19 were tracked as GitHub issues; the markdown tasks continue at F20.
ID_PREFIX=F
ID_START=20

# Approvals before work starts:
#   epic        approve the epic; the architect's hook publishes the task list right away and you
#               choose among the ready tasks when /fwork starts them (recommended)
#   epic+tasks  approve the epic, then its task list before it is published
#   tasks       epics are approved automatically; approve the task list only
#   none        no approvals; the team only stops for real decisions
GATES=epic

# Developer agents working in parallel during /fwork (each in its own git worktree), plus one QA agent.
DEVELOPERS=2

# Epic size: one working day of the agent team. The team lead splits epics with more tasks than this
# (back to the product owner); the developer gate stops tasks bigger than TASK_MAX_LINES changed lines
# (tests, lock files and migrations not counted).
EPIC_MAX_TASKS=9
TASK_MAX_LINES=400

# Branch that task branches start from and PRs target (main → feature branch → main).
BASE_BRANCH=main

# How PRs land on the base branch once all required checks pass:
#   squash  one commit per task, titled "<ID> – <title>" (recommended: the hooks' commits are templated)
#   rebase  linear history, every commit kept   merge  merge commit
MERGE_METHOD=squash

# Merge PRs automatically when the pipeline's required checks pass. Needs CI and branch protection on
# BASE_BRANCH with required status checks; until then leave it off and merge the PRs yourself.
AUTO_MERGE=on

# Model per role (written into .claude/agents/*.md by /finit when it changes):
#   economy   Sonnet for every role except QA (it is also the reviewer)
#   balanced  Sonnet for the product owner, designer and the developers; the session's model
#             (`inherit`) for the architect, team lead, CloudOps and QA
#   max       the session's model for every role
COST=balanced

# Daily cutoff (local time, HH:MM) or off: after it /fwork starts no new tasks, finishes the ones in
# flight and reports what carries over to the next /fwork run.
CUTOFF=off
