# Workflow settings for the team (/fdeliver, /ffix, the agents). /finit sets them for a new project;
# edit them any time. Read with `.claude/scripts/fdoc.sh config` (validated); KEY=value, # comments.

# Ticket ID prefix and first number: F → F6, F7, …; ENG- → ENG-1, ENG-2, …
# Letters, optionally followed by a dash. Change it only before the first ticket of a project.
ID_PREFIX=F
ID_START=1

# Which approvals /fdeliver asks for before building:
#   plan+spec  approve the plans, then the specs (per epic or per feature)
#   spec       plans are approved automatically; approve the specs only
#   none       no gates; it only stops for real decisions (product behaviour, irreversible, security, cost)
GATES=plan+spec

# How often the independent reviewers run:
#   risk         every phase that touches auth, permissions/tenant data, payments, personal data,
#                infrastructure/CI or migrations is reviewed on its own; other features once at the end
#   every-phase  every phase is reviewed
#   end-only     one review per feature at the end
# The last review of every feature always includes a security pass.
REVIEW=risk

# Merge PRs automatically when the required checks pass and no must/should finding is open.
# Switch to on only once CI and branch protection exist.
AUTO_MERGE=off

# Most phases a feature may have before the product owner splits it.
MAX_PHASES=3

# Branch that feature branches start from and PRs target.
BASE_BRANCH=main

# Model per role (written into .claude/agents/*.md by /finit when it changes):
#   economy   Sonnet for every role except the reviewer
#   balanced  Sonnet for the product owner and designer, the strongest model for the rest
#   max       the strongest model for every role
COST=balanced
