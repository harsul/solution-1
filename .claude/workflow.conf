# Workflow settings for the team (/fepic, /fplan, /fwork, /ffix and the agents). /finit sets them for a
# new project; edit them any time. Read with `.claude/scripts/fgit.sh config` (validated); KEY=value, # comments.

# Task ID prefix and first number: F → F6, F7, …; ENG- → ENG-1, ENG-2, …
# Letters, optionally followed by a dash. Change it only before the first task of a project.
ID_PREFIX=F
ID_START=1

# Approvals before work starts:
#   epic+tasks  approve the epic (product owner), then its task list (team lead + architect)
#   tasks       epics are approved automatically; approve the task list only
#   none        no approvals; the team only stops for real decisions
GATES=epic+tasks

# Developer agents working in parallel during /fwork (each in its own git worktree), plus one QA agent.
DEVELOPERS=2

# Epic size: one working day of the agent team. The team lead splits epics with more tasks than this
# (back to the product owner), and tasks bigger than TASK_MAX_LINES changed lines (tests and lock
# files not counted) into smaller tasks.
EPIC_MAX_TASKS=9
TASK_MAX_LINES=400

# Branch that task branches start from and PRs target (main → feature branch → main).
BASE_BRANCH=main

# How PRs land on the base branch once all required checks pass:
#   rebase  linear history, every commit kept (recommended)   squash  one commit per task   merge  merge commit
MERGE_METHOD=rebase

# Merge PRs automatically when the pipeline's required checks pass. Needs CI and branch protection on
# BASE_BRANCH with required status checks; until then leave it off and merge the PRs yourself.
AUTO_MERGE=on

# Model per role (written into .claude/agents/*.md by /finit when it changes):
#   economy   Sonnet for every role except the reviewer
#   balanced  Sonnet for the product owner, designer, QA and the developers; the session's model
#             (`inherit`) for the architect, team lead, CloudOps and reviewer
#   max       the session's model for every role
COST=balanced

# Daily cutoff (local time, HH:MM) or off: after it /fwork claims no new tasks, finishes the ones in
# flight and posts the day report with what carries over to the next /fwork run.
CUTOFF=off
